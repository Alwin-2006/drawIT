name: Deploy to EC2

on:
  push:
    branches:
      - main   # change to master if that's your default branch

jobs:
  deploy:
    name: SSH into EC2 and redeploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Connect to EC2 via SSH and run deploy commands ──────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.EC2_HOST }}
          username:    ${{ secrets.EC2_USER }}
          key:         ${{ secrets.EC2_SSH_KEY }}
          port:        22
          script: |
            set -e

            # ── Pull latest code ─────────────────────────────────────────────
            cd ~/drawIT
            git pull origin main

            # ── Write the .env file from GitHub secrets ──────────────────────
            # This overwrites the file on every deploy so secrets stay in sync.
            cat > .env <<'ENVEOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            REDIS_URL=redis://redis:6379
            REDIS_PORT=6379
            BACKEND_PORT=3000
            FRONTEND_PORT=80
            NODE_ENV=production
            ENVEOF

            # ── Rebuild changed images and restart containers ─────────────────
            docker compose pull        # pull any updated base images (mongo, redis, etc.)
            docker compose up -d --build --remove-orphans

            # ── Clean up dangling images to free disk space ───────────────────
            docker image prune -f
