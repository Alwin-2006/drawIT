services:
  redis:
    image: redis:8.4.0-alpine
    container_name: mern-redis
    restart: always
    # Not exposed to the host — only reachable inside the Docker network
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - mern-network

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: mern-backend
    restart: always
    # Not exposed to the host — traffic arrives via the nginx proxy
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - redis
    networks:
      - mern-network

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    container_name: mern-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # Both /api and /socket.io are proxied through nginx — no separate backend URL needed
    environment:
      - VITE_BACKEND_URL=""
      - VITE_API_URL=""
    depends_on:
      - backend
    networks:
      - mern-network

volumes:
  redis-data:

networks:
  mern-network:
    driver: bridge
